name: Validate Index

on:
  pull_request:
    paths:
      - "index.yaml"
      - "rimes/**"
      - "plugins/**"
      - "models/**"
      - "layouts/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "index.yaml"
      - "rimes/**"
      - "plugins/**"
      - "models/**"
      - "layouts/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      # ─── 1. 生成索引并校验结构 ──────────────────────
      - name: Generate index files and validate structure
        run: |
          uv run python scripts/ci-update.py
          python3 -c "
          import yaml, sys

          def validate(path, key):
              with open(path) as f:
                  data = yaml.safe_load(f)
              assert data.get('index_version') == 1, f'{path}: index_version must be 1'
              assert key in data, f'{path}: missing \"{key}\"'
              items = data[key]
              for entry in items:
                  assert 'id' in entry
                  assert 'name' in entry
                  assert 'currentVersion' in entry
                  assert 'versions' in entry
                  for v in entry['versions']:
                      assert 'version' in v
                      assert 'date' in v
              print(f'  ✓ {path}: {len(items)} entries')

          validate('rimes/index.yaml', 'schemas')
          validate('plugins/index.yaml', 'plugins')
          validate('models/index.yaml', 'models')
          validate('layouts/index.yaml', 'layouts')

          # v2 插件索引（index_version 2，含新插件系统元数据）
          import yaml as _yaml
          with open('plugins/v2/index.yaml') as f:
              v2 = _yaml.safe_load(f)
          assert v2.get('index_version') == 2, 'plugins/v2/index.yaml: index_version must be 2'
          items = v2.get('plugins') or []
          assert items, 'plugins/v2/index.yaml: missing plugins'
          for e in items:
              assert e.get('id') and e.get('name') and e.get('currentVersion') and e.get('versions'), e
              assert e.get('pluginType'), e['id'] + ': missing pluginType'
              for v in e['versions']:
                  assert v.get('version') and v.get('date'), e['id']
                  for item in v.get('downloadUrl', []):
                      assert item.get('url'), e['id'] + ' v' + v['version'] + ': missing url'
          print('  ✓ plugins/v2/index.yaml: {} entries (v2)'.format(len(items)))
          print('✅ All index files valid')
          "

      # ─── 2. 校验主索引结构 ───────────────────────────
      - name: Validate main index.yaml
        run: |
          python3 -c "
          import yaml
          with open('index.yaml') as f:
              data = yaml.safe_load(f)
          assert data.get('index_version') == 1, 'index_version must be 1'
          assert 'schemas' in data and 'from' in data['schemas'], 'missing schemas.from'
          assert 'plugins' in data and 'from' in data['plugins'], 'missing plugins.from'
          assert 'plugins_v2' in data and 'from' in data['plugins_v2'], 'missing plugins_v2.from'
          assert 'models' in data and 'from' in data['models'], 'missing models.from'
          assert 'layouts' in data and 'from' in data['layouts'], 'missing layouts.from'
          assert 'sources' in data, 'missing sources'
          print('OK: main index.yaml is valid')
          "

      # ─── 3. 检查下载链接可达性 ───────────────────────
      - name: Check remote download URLs are reachable
        run: |
          python3 -c "
          import yaml, urllib.request, sys

          def check_urls(index_path, items_key, is_model=False):
              failures = 0
              with open(index_path) as f:
                  data = yaml.safe_load(f)
              for entry in data[items_key]:
                  if entry.get('type') != 'remote':
                      continue
                  for v in entry.get('versions', []):
                      if is_model:
                          # models: check archive.url + files[*].url
                          if 'archive' in v:
                              url = v['archive'].get('url', '')
                              if url:
                                  try:
                                      code = urllib.request.urlopen(url, timeout=10).getcode()
                                      print('  OK  {} {} archive ({})'.format(entry['id'], v['version'], code))
                                  except Exception as e:
                                      print('  FAIL {} {} archive → {}'.format(entry['id'], v['version'], e))
                                      failures += 1
                          for f in v.get('files', []):
                              url = f.get('url', '')
                              if url:
                                  try:
                                      code = urllib.request.urlopen(url, timeout=10).getcode()
                                      print('  OK  {} {} {} ({})'.format(entry['id'], v['version'], f['name'], code))
                                  except Exception as e:
                                      print('  FAIL {} {} {} → {}'.format(entry['id'], v['version'], f['name'], e))
                                      failures += 1
                      else:
                          for item in v.get('downloadUrl', []):
                              url = item.get('url', '')
                              if url:
                                  try:
                                      code = urllib.request.urlopen(url, timeout=10).getcode()
                                      print('  OK  {} {} ({})'.format(entry['id'], v['version'], code))
                                  except Exception as e:
                                      print('  FAIL {} {} → {}'.format(entry['id'], v['version'], e))
                                      failures += 1
              return failures

          failures = check_urls('rimes/index.yaml', 'schemas')
          failures += check_urls('plugins/index.yaml', 'plugins')
          failures += check_urls('plugins/v2/index.yaml', 'plugins')
          failures += check_urls('models/index.yaml', 'models', is_model=True)
          failures += check_urls('layouts/index.yaml', 'layouts')

          if failures:
              sys.exit(1)
          print('All remote URLs are reachable')
          "
